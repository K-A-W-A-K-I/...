
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{max-width:420px;margin:0 auto;padding:12px}
.header{text-align:center;padding:16px 0 8px}
.header h1{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.header p{font-size:13px;color:var(--color-text-secondary);margin-top:4px}
.date-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:12px;border:0.5px solid var(--color-border-tertiary)}
.date-bar span{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.date-bar button{font-size:18px;background:none;border:none;cursor:pointer;color:var(--color-text-secondary);padding:0 6px}
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.goal-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;border:0.5px solid var(--color-border-tertiary)}
.goal-card.full{grid-column:1/-1}
.goal-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.goal-values{display:flex;align-items:baseline;gap:4px}
.goal-current{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.goal-max{font-size:12px;color:var(--color-text-secondary)}
.goal-unit{font-size:11px;color:var(--color-text-secondary)}
.progress-bar{height:5px;background:var(--color-border-tertiary);border-radius:99px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.3s}
.cal-fill{background:#E24B4A}
.pro-fill{background:#1D9E75}
.carb-fill{background:#BA7517}
.fat-fill{background:#7F77DD}
.section-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin:14px 0 8px;text-transform:uppercase;letter-spacing:0.04em}
.food-item{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;margin-bottom:8px}
.food-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.food-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.food-badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--color-background-info);color:var(--color-text-info)}
.food-macros{display:flex;gap:10px;font-size:11px;color:var(--color-text-secondary);margin-bottom:10px}
.food-macros span{display:flex;flex-direction:column;align-items:center;gap:1px}
.food-macros strong{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.qty-row{display:flex;align-items:center;gap:10px}
.qty-row input[type=range]{flex:1}
.qty-label{font-size:12px;font-weight:500;color:var(--color-text-primary);min-width:48px;text-align:right}
.add-btn{width:100%;padding:8px;font-size:13px;font-weight:500;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;color:var(--color-text-primary);margin-top:6px;transition:background 0.15s}
.add-btn:active{transform:scale(0.98)}
.add-btn.added{background:var(--color-background-success);color:var(--color-text-success);border-color:var(--color-border-success)}
.log-section{margin-top:4px}
.log-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:6px;border:0.5px solid var(--color-border-tertiary)}
.log-left{display:flex;flex-direction:column;gap:2px}
.log-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.log-sub{font-size:11px;color:var(--color-text-secondary)}
.log-cal{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.log-del{background:none;border:none;cursor:pointer;font-size:16px;color:var(--color-text-tertiary);padding:0 4px}
.custom-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:14px;margin-bottom:8px}
.custom-box h3{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px}
.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.custom-grid input,.custom-full input{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary)}
.custom-full{margin-bottom:8px}
.tab-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:500;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-secondary)}
.empty-log{text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:13px}
</style>

<div class="app">
  <div class="header">
    <h1>Calorie Tracker</h1>
    <p>Daily goal: 2,200–2,300 kcal · 160g protein</p>
  </div>

  <div class="date-bar">
    <button onclick="changeDay(-1)">&#8592;</button>
    <span id="dateLabel">Today</span>
    <button onclick="changeDay(1)">&#8594;</button>
  </div>

  <div class="goals-grid">
    <div class="goal-card full">
      <div class="goal-label">Calories</div>
      <div class="goal-values">
        <span class="goal-current" id="calVal">0</span>
        <span class="goal-max">/ 2,250</span>
        <span class="goal-unit">kcal</span>
      </div>
      <div class="progress-bar"><div class="progress-fill cal-fill" id="calBar" style="width:0%"></div></div>
    </div>
    <div class="goal-card">
      <div class="goal-label">Protein</div>
      <div class="goal-values">
        <span class="goal-current" id="proVal">0</span>
        <span class="goal-max">/ 160g</span>
      </div>
      <div class="progress-bar"><div class="progress-fill pro-fill" id="proBar" style="width:0%"></div></div>
    </div>
    <div class="goal-card">
      <div class="goal-label">Carbs</div>
      <div class="goal-values">
        <span class="goal-current" id="carbVal">0</span>
        <span class="goal-max">/ 220g</span>
      </div>
      <div class="progress-bar"><div class="progress-fill carb-fill" id="carbBar" style="width:0%"></div></div>
    </div>
    <div class="goal-card">
      <div class="goal-label">Fat</div>
      <div class="goal-values">
        <span class="goal-current" id="fatVal">0</span>
        <span class="goal-max">/ 60g</span>
      </div>
      <div class="progress-bar"><div class="progress-fill fat-fill" id="fatBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="tab-bar" id="tabBar"></div>

  <div id="foodList"></div>

  <div class="custom-box">
    <h3>Add custom food</h3>
    <div class="custom-full"><input type="text" id="cName" placeholder="Food name" /></div>
    <div class="custom-grid">
      <input type="number" id="cCal" placeholder="Calories (kcal)" min="0" />
      <input type="number" id="cPro" placeholder="Protein (g)" min="0" />
      <input type="number" id="cCarb" placeholder="Carbs (g)" min="0" />
      <input type="number" id="cFat" placeholder="Fat (g)" min="0" />
    </div>
    <button class="add-btn" onclick="addCustom()">Add custom food</button>
  </div>

  <div class="section-title">Today's log</div>
  <div class="log-section" id="logSection"></div>
</div>

<script>
const FOODS = {
  "Eggs & Dairy": [
    {name:"Egg",unit:"eggs",step:1,min:1,max:10,cal:70,pro:6,carb:0.5,fat:5},
    {name:"Greek yogurt",unit:"g",step:50,min:100,max:400,cal:0.65,pro:0.085,carb:0.04,fat:0.015},
    {name:"President cheese",unit:"slices",step:1,min:1,max:5,cal:70,pro:2,carb:0,fat:6},
    {name:"Delice yogurt",unit:"g",step:50,min:100,max:300,cal:0.9,pro:0.03,carb:0.12,fat:0.03},
  ],
  "Protein": [
    {name:"Chicken breast",unit:"g",step:50,min:100,max:400,cal:1.65,pro:0.31,carb:0,fat:0.036},
    {name:"Tuna (canned)",unit:"g",step:50,min:50,max:300,cal:1.1,pro:0.25,carb:0,fat:0.01},
    {name:"Sardines",unit:"g",step:50,min:50,max:200,cal:1.8,pro:0.21,carb:0,fat:0.1},
    {name:"Salami",unit:"g",step:10,min:10,max:100,cal:3.5,pro:0.13,carb:0.02,fat:0.3},
    {name:"Smoked sausage",unit:"g",step:50,min:50,max:200,cal:2.8,pro:0.13,carb:0.01,fat:0.24},
  ],
  "Carbs": [
    {name:"Toast complet",unit:"slices",step:1,min:1,max:6,cal:80,pro:3,carb:15,fat:1},
    {name:"Oats",unit:"g",step:20,min:40,max:200,cal:3.89,pro:0.17,carb:0.66,fat:0.07},
    {name:"Rice (cooked)",unit:"g",step:50,min:100,max:400,cal:1.3,pro:0.027,carb:0.28,fat:0.003},
    {name:"Makarona (cooked)",unit:"g",step:50,min:100,max:400,cal:1.31,pro:0.05,carb:0.25,fat:0.011},
    {name:"Couscous (cooked)",unit:"g",step:50,min:100,max:400,cal:1.12,pro:0.038,carb:0.23,fat:0.002},
    {name:"Boiled batata",unit:"g",step:50,min:100,max:400,cal:0.86,pro:0.02,carb:0.2,fat:0},
    {name:"Mlewi",unit:"pieces",step:1,min:1,max:4,cal:320,pro:7,carb:42,fat:14},
    {name:"Banana",unit:"pieces",step:1,min:1,max:5,cal:90,pro:1,carb:23,fat:0.3},
  ],
  "Fats & Nuts": [
    {name:"Peanut butter",unit:"tbsp",step:1,min:1,max:6,cal:95,pro:4,carb:3,fat:8},
    {name:"Mixed nuts",unit:"g",step:10,min:10,max:100,cal:5.8,pro:0.18,carb:0.2,fat:0.5},
    {name:"Peanuts (kakawiya)",unit:"g",step:10,min:10,max:150,cal:5.6,pro:0.26,carb:0.2,fat:0.45},
    {name:"Jeljlen (sesame)",unit:"g",step:5,min:5,max:60,cal:5.73,pro:0.18,carb:0.23,fat:0.5},
    {name:"Olive oil",unit:"tbsp",step:1,min:1,max:5,cal:120,pro:0,carb:0,fat:14},
    {name:"Almonds",unit:"g",step:10,min:10,max:100,cal:5.79,pro:0.21,carb:0.22,fat:0.5},
  ],
  "Other": [
    {name:"Honey",unit:"tbsp",step:1,min:1,max:5,cal:60,pro:0,carb:17,fat:0},
    {name:"Dark chocolate",unit:"pieces",step:1,min:1,max:10,cal:20,pro:0.3,carb:2.3,fat:1.3},
    {name:"Coffee (no sugar)",unit:"cups",step:1,min:1,max:5,cal:5,pro:0,carb:1,fat:0},
    {name:"Jaljalana",unit:"tbsp",step:1,min:1,max:6,cal:80,pro:1.5,carb:6,fat:5},
  ]
};

const GOALS = {cal:2250,pro:160,carb:220,fat:60};
const cats = Object.keys(FOODS);
let activeTab = cats[0];
let dayOffset = 0;
let allDays = {};

function getDateKey(offset){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}
function getDayLabel(offset){
  if(offset===0)return'Today';
  if(offset===-1)return'Yesterday';
  const d=new Date();d.setDate(d.getDate()+offset);
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function getLog(){
  const k=getDateKey(dayOffset);
  if(!allDays[k])allDays[k]=[];
  return allDays[k];
}
function calcTotals(){
  return getLog().reduce((a,i)=>({cal:a.cal+i.cal,pro:a.pro+i.pro,carb:a.carb+i.carb,fat:a.fat+i.fat}),{cal:0,pro:0,carb:0,fat:0});
}
function pct(v,max){return Math.min(100,Math.round(v/max*100));}
function updateSummary(){
  const t=calcTotals();
  document.getElementById('calVal').textContent=Math.round(t.cal);
  document.getElementById('proVal').textContent=Math.round(t.pro)+'g';
  document.getElementById('carbVal').textContent=Math.round(t.carb)+'g';
  document.getElementById('fatVal').textContent=Math.round(t.fat)+'g';
  document.getElementById('calBar').style.width=pct(t.cal,GOALS.cal)+'%';
  document.getElementById('proBar').style.width=pct(t.pro,GOALS.pro)+'%';
  document.getElementById('carbBar').style.width=pct(t.carb,GOALS.carb)+'%';
  document.getElementById('fatBar').style.width=pct(t.fat,GOALS.fat)+'%';
  document.getElementById('dateLabel').textContent=getDayLabel(dayOffset);
  renderLog();
}
function getFoodVal(f,qty){
  if(f.unit==='g'||f.unit==='ml'){
    return{cal:f.cal*qty,pro:f.pro*qty,carb:f.carb*qty,fat:f.fat*qty};
  }
  return{cal:f.cal*qty,pro:f.pro*qty,carb:f.carb*qty,fat:f.fat*qty};
}
function renderTabs(){
  const bar=document.getElementById('tabBar');
  bar.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='tab'+(c===activeTab?' active':'');
    b.textContent=c;
    b.onclick=()=>{activeTab=c;renderTabs();renderFoods();};
    bar.appendChild(b);
  });
}
function renderFoods(){
  const list=document.getElementById('foodList');
  list.innerHTML='';
  (FOODS[activeTab]||[]).forEach((f,fi)=>{
    const div=document.createElement('div');
    div.className='food-item';
    const isCount=f.unit!=='g'&&f.unit!=='ml';
    const initQty=f.min;
    const vals=getFoodVal(f,initQty);
    div.innerHTML=`
      <div class="food-header">
        <span class="food-name">${f.name}</span>
        <span class="food-badge">${f.unit}</span>
      </div>
      <div class="food-macros">
        <span><strong id="fc_${activeTab}_${fi}_cal">${Math.round(vals.cal)}</strong>kcal</span>
        <span><strong id="fc_${activeTab}_${fi}_pro">${Math.round(vals.pro)}g</strong>protein</span>
        <span><strong id="fc_${activeTab}_${fi}_carb">${Math.round(vals.carb)}g</strong>carbs</span>
        <span><strong id="fc_${activeTab}_${fi}_fat">${Math.round(vals.fat)}g</strong>fat</span>
      </div>
      <div class="qty-row">
        <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${initQty}"
          oninput="updateFoodCard('${activeTab}',${fi},this.value)"
          id="fslider_${activeTab}_${fi}" />
        <span class="qty-label" id="fqty_${activeTab}_${fi}">${initQty} ${isCount?f.unit:f.unit}</span>
      </div>
      <button class="add-btn" id="fbtn_${activeTab}_${fi}" onclick="addFood('${activeTab}',${fi})">Add to log</button>
    `;
    list.appendChild(div);
  });
}
function updateFoodCard(cat,fi,qty){
  qty=parseFloat(qty);
  const f=FOODS[cat][fi];
  const v=getFoodVal(f,qty);
  document.getElementById(`fc_${cat}_${fi}_cal`).textContent=Math.round(v.cal);
  document.getElementById(`fc_${cat}_${fi}_pro`).textContent=Math.round(v.pro)+'g';
  document.getElementById(`fc_${cat}_${fi}_carb`).textContent=Math.round(v.carb)+'g';
  document.getElementById(`fc_${cat}_${fi}_fat`).textContent=Math.round(v.fat)+'g';
  document.getElementById(`fqty_${cat}_${fi}`).textContent=qty+' '+f.unit;
}
function addFood(cat,fi){
  const f=FOODS[cat][fi];
  const qty=parseFloat(document.getElementById(`fslider_${cat}_${fi}`).value);
  const v=getFoodVal(f,qty);
  getLog().push({name:f.name+' ('+qty+' '+f.unit+')',cal:v.cal,pro:v.pro,carb:v.carb,fat:v.fat,id:Date.now()});
  const btn=document.getElementById(`fbtn_${cat}_${fi}`);
  btn.textContent='Added!';btn.classList.add('added');
  setTimeout(()=>{btn.textContent='Add to log';btn.classList.remove('added');},1200);
  updateSummary();
}
function addCustom(){
  const name=document.getElementById('cName').value.trim();
  const cal=parseFloat(document.getElementById('cCal').value)||0;
  const pro=parseFloat(document.getElementById('cPro').value)||0;
  const carb=parseFloat(document.getElementById('cCarb').value)||0;
  const fat=parseFloat(document.getElementById('cFat').value)||0;
  if(!name){alert('Please enter a food name');return;}
  getLog().push({name,cal,pro,carb,fat,id:Date.now()});
  document.getElementById('cName').value='';
  document.getElementById('cCal').value='';
  document.getElementById('cPro').value='';
  document.getElementById('cCarb').value='';
  document.getElementById('cFat').value='';
  updateSummary();
}
function removeLog(id){
  const k=getDateKey(dayOffset);
  allDays[k]=allDays[k].filter(i=>i.id!==id);
  updateSummary();
}
function renderLog(){
  const sec=document.getElementById('logSection');
  const log=getLog();
  if(!log.length){sec.innerHTML='<div class="empty-log">No foods logged yet</div>';return;}
  sec.innerHTML=log.map(i=>`
    <div class="log-item">
      <div class="log-left">
        <span class="log-name">${i.name}</span>
        <span class="log-sub">${Math.round(i.pro)}g protein · ${Math.round(i.carb)}g carbs · ${Math.round(i.fat)}g fat</span>
      </div>
      <span class="log-cal">${Math.round(i.cal)} kcal</span>
      <button class="log-del" onclick="removeLog(${i.id})">&#10005;</button>
    </div>
  `).join('');
}
function changeDay(d){
  dayOffset+=d;
  if(dayOffset>0)dayOffset=0;
  renderFoods();
  updateSummary();
}
renderTabs();
renderFoods();
updateSummary();
</script>
