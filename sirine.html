<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Will You Be My Valentine? 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            animation: fadeIn 0.6s ease;
        }

        h1 {
            color: #e11d48;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #444;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #yesBtn {
            background: #22c55e;
            color: white;
        }

        #noBtn {
            background: #ef4444;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card" id="page1">
    <h1>💖 Will You Be My Valentine? 💖</h1>
    <p>I promise to make you smile, always 🥰</p>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
        <button id="noBtn" onclick="noClicked()">No 🙈</button>
    </div>
</div>

<div class="card" id="page2" style="display:none;">
    <h1>Thank You My Valentine 💘</h1>
    <p>You just made my day 🥹❤️</p>
    <h2>🥰🥰🥰</h2>
</div>

<script>
    let scale = 1;

    function noClicked() {
        scale += 0.3;
        const yesBtn = document.getElementById("yesBtn");
        yesBtn.style.transform = `scale(${scale})`;
    }

    function yesClicked() {
        document.getElementById("page1").style.display = "none";
        document.getElementById("page2").style.display = "block";
    }
</script>

</body>
</html>
